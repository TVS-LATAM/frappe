<div class="kanban-card-wrapper {{ size_class }} {{ disable_click }}" data-name="{{ encodeURIComponent(name) }}">
	<div class="kanban-card-container">
		<div class="kanban-card content">
			{% if(image_url) { %}
			<div class="kanban-image">
				<img src="{{ image_url }}" alt="{{ title }}">
			</div>
			{% } %}
			<div class="kanban-card-body">
				<div class="kanban-title-area">
					<a href="{{ form_link }}" class="kanban-card-title-link">
						<div class="kanban-card-title ellipsis" title="{{title}}">
							{{ title }}
						</div>
					</a>
					<div class="kanban-card-detail-button" title="Show details">
						<i class="fa fa-info-circle"></i>
					</div>
					{% if(queue_position !== 0) { %}
					<div class="circle-position {% if appointment_date %}has-appointment red{% endif %}">
						<span class="circle-icon">
							{% if appointment_date %}
							<div class="hover-date" title="Appointment Date: Day-Month">{{ appointment_date }}</div>
							{% else %}
							<span style="user-select: none;" title="Queue Position">{{ queue_position }}</span>
							{% endif %}
						</span>
					</div>
					{% } %}
				</div>
				<div class="kanban-handler">
					<div class="kanban-card-doc text-muted">
						{{ doc_content }}
					</div>
					{% if size_class != 'small' %}
					<div class="kanban-card-meta"></div>
					{% endif %}
				</div>
				<div class="kanban-card-touch-button">
					<button class="btn btn-xs btn-default">Show Details</button>
				</div>
			</div>
		</div>
		<div class="kanban-card-details">
			<div class="kanban-card-details-header">
				<h4>{{ name }}</h4>
				<a href="{{ form_link }}" class="btn btn-xs btn-default">
					<i class="fa fa-external-link"></i> {{ __('Open') }}
				</a>
			</div>
			<div class="kanban-card-details-body">
				<!-- Details will be populated by JavaScript -->
			</div>
		</div>
	</div>
</div>



<style>
	.kanban-title-area {
		display: flex;
		align-items: center;
		position: relative;
		width: 100%;
	}

	.circle.red {
		border-color: #d14343;
	}

	.kanban-card-title-link {
		overflow: hidden;
		max-width: 85%;
		display: block;
	}

	.kanban-card-title {
		flex: 1;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		width: 100%;
	}

	.circle-position {
		position: absolute;
		right: -0.4rem;
		top: -0.32rem;
		border: 0.1875em solid #e1e1e1;
		border-radius: 50%;
		height: 3em;
		width: 3em;
		background-color: rgba(255, 255, 255, 0.846);
		display: flex;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.hover-date {
		font-size: 0.7em;
		color: #d14343;
		white-space: nowrap;
		transform: scale(1);
		user-select: none;
		transition: transform 0.3s ease;
	}

	.has-appointment:hover .hover-date {
		transform: scale(1.3);
	}

	.circle-icon {
		color: #d14343;
		animation: heartbeat 1s infinite;
	}

	@keyframes heartbeat {
		0%,
		100% {
			transform: scale(1);
		}

		25%,
		75% {
			transform: scale(1.1);
		}

		50% {
			transform: scale(1.2);
		}
	}

	.kanban-card-container {
		transition: all 0.3s ease;
	}

	.kanban-card-details {
		position: absolute;
		top: 0;
		left: 97%;
		width: 500px;
		background-color: #fff;
		border-radius: 8px;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
		transition: all 0.3s ease;
		overflow: auto;
		opacity: 0;
		z-index: 100000;
		pointer-events: none;
		max-height: 500px;
		border: 1px solid #e1e9f0;
	}

	.kanban-card-details.expanded {
		opacity: 1;
		transform: translateX(5px);
		pointer-events: auto;
	}

	.with-details .kanban-card-details {
		opacity: 1;
		transform: translateX(5px);
		pointer-events: auto;
	}

	.kanban-card-details-header {
		padding: 15px;
		border-bottom: 1px solid #e1e9f0;
		display: flex;
		justify-content: space-between;
		align-items: center;
		background-color: #f8fafc;
	}

	.kanban-card-details-header h4 {
		margin: 0;
		font-size: 16px;
		font-weight: 600;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		max-width: 300px;
		color: #1f272e;
	}

	.kanban-card-details-body {
		padding: 16px;
		overflow-y: auto;
		max-height: calc(100% - 60px);
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
		gap: 12px;
		align-items: start;
		background-color: #ffffff;
	}

	.kanban-card-detail-item {
		margin-bottom: 10px;
		min-width: 0;
		word-wrap: break-word;
		overflow-wrap: break-word;
		padding: 12px;
		border-radius: 6px;
		background-color: #f8fafc;
		border: 1px solid #eef1f5;
		transition: all 0.2s ease;
	}

	.kanban-card-detail-item.item-full{
		grid-column: 1 / -1; /* Span all columns */
		width: 100%;
		
	}
	
	.kanban-card-detail-item:hover {
		box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
		border-color: #e1e9f0;
	}

	.kanban-card-detail-label {
		font-size: 13px;
		color: #6c7680;
		margin-bottom: 6px;
		font-weight: 500;
		text-transform: uppercase;
		letter-spacing: 0.5px;
	}

	.kanban-card-detail-value {
		font-size: 14px;
		background: #ffffff;
		color: #1f272e;
		padding: 8px 10px;
		border-radius: 4px;
		border: 1px solid #eef1f5;
		line-height: 1.5;
		max-height: 200px;
		overflow-y: auto;
	}

	.kanban-card-detail-button {
		cursor: pointer;
		color: #8d99a6;
		margin-left: 5px;
	}

	.kanban-card-detail-button:hover {
		color: #36414c;
	}

	.kanban-card-touch-button {
		display: none;
		text-align: center;
		margin-top: 8px;
	}
</style>
