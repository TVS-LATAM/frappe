<div class="kanban-card-wrapper {{ size_class }} {{ disable_click }}" data-name="{{ encodeURIComponent(name) }}">
	<div class="kanban-card-container">
		<div class="kanban-card content">
			{% if(image_url) { %}
			<div class="kanban-image">
				<img src="{{ image_url }}" alt="{{ title }}">
			</div>
			{% } %}
			<div class="kanban-card-body">
				<div class="kanban-title-area">
					<a href="{{ form_link }}" class="kanban-card-title-link">
						<div class="kanban-card-title ellipsis" title="{{title}}">
							{{ title }}
						</div>
					</a>
					{% if(lane_icon) { %}
					<div class="lane-icon-header">
						{{ lane_icon }}
					</div>
					{% } %}
					{% if(queue_position !== 0) { %}
					<div class="circle-position {% if appointment_date %}has-appointment red{% endif %}">
						<span class="circle-icon">
							{% if appointment_date %}
							<div class="hover-date" title="Appointment Date: Day-Month">{{ appointment_date }}</div>
							{% else %}
							<span style="user-select: none;" title="Queue Position">{{ queue_position }}</span>
							{% endif %}
						</span>
					</div>
					{% } %}
				</div>
				<div class="kanban-handler">
					<div class="kanban-card-doc text-muted">
						{{ doc_content }}
					</div>
					{% if size_class != 'small' %}
					<div class="kanban-card-meta"></div>
					{% endif %}
				</div>
				<div class="kanban-card-touch-button">
					<button class="btn btn-xs btn-default">Show Details</button>
				</div>
			</div>
		</div>
	</div>
</div>



<style>
	.kanban-title-area {
		display: flex;
		align-items: center;
		position: relative;
		width: 100%;
	}

	.circle.red {
		border-color: #d14343;
	}

	.kanban-card-title-link {
		overflow: hidden;
		max-width: 85%;
		display: block;
	}

	.kanban-card-title {
		flex: 1;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		width: 100%;
	}

	.circle-position {
		position: absolute;
		right: -0.4rem;
		top: -0.32rem;
		border: 0.1875em solid #e1e1e1;
		border-radius: 50%;
		height: 3em;
		width: 3em;
		background-color: rgba(255, 255, 255, 0.846);
		display: flex;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.hover-date {
		font-size: 0.7em;
		color: #d14343;
		white-space: nowrap;
		transform: scale(1);
		user-select: none;
		transition: transform 0.3s ease;
	}

	.has-appointment:hover .hover-date {
		transform: scale(1.3);
	}

	.circle-icon {
		color: #d14343;
		animation: heartbeat 1s infinite;
	}

	.kanban-card-wrapper {
		padding: 2px !important;
		margin: 0 !important;
		width: 100%;
		display: block;
		box-sizing: border-box;
	}

	.kanban-card-container {
		transition: all 0.3s ease;
		padding: 0 !important;
		margin: 0 !important;
		width: 100%;
		display: block;
		box-sizing: border-box;
	}

	.kanban-card.content {
		padding: 0 !important;
		margin: 0 !important;
		width: 100%;
		display: block;
		overflow: hidden;
		box-sizing: border-box;
	}

	.conversation-border {
		border: 2px solid #0cc144 !important;
	}

	.kanban-card-body {
		padding: 0 !important;
		margin: 0 !important;
		width: 100%;
		max-width: 100%;
		box-sizing: border-box;
	}

	.kanban-title-area {
		max-width: 100% !important;
		padding: 4px 8px !important;
		background-color: #f5f5f5 !important;
		width: 100% !important;
	}

	.kanban-card-title-link {
		max-width: 100% !important;
		flex: 1 !important;
	}

	.kanban-card-title {
		font-weight: 600;
		font-size: 12px;
		color: #333;
		margin-bottom: 2px;
	}

	.kanban-handler {
		padding: 4px 8px !important;
		width: 100% !important;
	}

	.kanban-card-doc {
		font-size: 10px;
		line-height: 1.2;
	}

	.kanban-card-doc div {
		display: flex;
		align-items: center;
		margin-bottom: 1px;
		gap: 4px;
	}

	.kanban-card-doc img {
		opacity: 0.7;
		height: 0.7rem !important;
	}

	.kanban-card-meta {
		margin-top: 4px;
		padding-top: 4px;
		border-top: 1px solid #f5f5f5;
	}

	.center_elements {
		display: flex;
		align-items: center;
		justify-content: flex-start;
		gap: 4px;
		flex-wrap: nowrap;
		overflow: visible;
	}

	.kanban-card-meta i {
		font-size: 0.9rem !important;
	}

	.lane-icon-header {
		margin-left: auto;
		margin-right: 2rem;
		display: flex;
		align-items: center;
		z-index: 10;
	}
</style>
